<header class="bg-primary text-white py-5 mb-5">
  <div class="container text-center">
    <h1 class="display-4 fw-bold">Nos Formations</h1>
    <p class="lead">Découvrez l'ensemble de nos programmes de formation.</p>
  </div>
</header>

<div class="container mb-5">
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let formation of formations">
      <mat-card class="h-100 shadow-sm hover-elevate d-flex flex-column">
        <img mat-card-image [src]="formation.image" [alt]="formation.title" style="height: 200px; object-fit: cover;">
        <mat-card-header class="mt-3">
          <mat-card-title class="fw-bold">{{ formation.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content class="mt-2 flex-grow-1">
          <p>{{ formation.subtitle }}</p>
        </mat-card-content>
        <mat-card-actions align="end" class="pb-3 pe-3">
          <a [routerLink]="['/formations', formation.id]" mat-raised-button color="primary">DÉCOUVRIR</a>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
