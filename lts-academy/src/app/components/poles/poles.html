<!-- ═══════════════════  POLES HERO (GOOGLE MD3 STYLE)  ═══════════════════ -->
<section class="hero-section text-center py-5">
  <div class="container hero-content">
    <h1 class="hero-title">Nos Pôles d'Excellence</h1>
    <p class="hero-subtitle">Découvrez nos départements de formation spécialisés pour répondre aux besoins et exigences du marché de l'emploi.</p>
  </div>
</section>

<!-- ═══════════════════  POLES & FORMATIONS GRID  ═══════════════════ -->
<section class="container mb-5">
  <div class="card-container">
    <div class="formation-card" *ngFor="let formation of formations">
      <div class="formation-card-img" [style.backgroundImage]="'url(' + formation.image + ')'"></div>
      <div class="formation-card-body">
        <div class="d-flex align-items-center justify-content-between mb-2" *ngIf="formation.duration">
          <span class="badge-modern"><i class="bi bi-clock"></i> {{ formation.duration }}</span>
          <span class="badge-modern" *ngIf="formation.mode"><i class="bi bi-geo-alt"></i> {{ formation.mode }}</span>
        </div>
        <h3 class="formation-card-title">{{ formation.title }}</h3>
        <p class="formation-card-text">{{ formation.subtitle }}</p>
        <div class="formation-card-actions">
          <a [routerLink]="['/formations', formation.id]" class="card-link">
            Explorer <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
