<!-- Chatbot Floating Button -->
<div class="chatbot-wrapper">

  <!-- Chat Panel -->
  <div class="chat-panel" [class.open]="isOpen" role="dialog" aria-label="Conseiller LTS Academy">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar">
          <mat-icon>smart_toy</mat-icon>
        </div>
        <div>
          <div class="chat-title">Conseiller LTS Academy</div>
          <div class="chat-status">
            <span class="status-dot" [class.typing]="isTyping"></span>
            {{ isTyping ? 'En train d\'écrire...' : 'En ligne' }}
          </div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button mat-icon-button (click)="clearChat()" matTooltip="Nouvelle conversation"
          class="header-btn">
          <mat-icon>refresh</mat-icon>
        </button>
        <button mat-icon-button (click)="closeChat()" matTooltip="Fermer" class="header-btn">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="chat-messages" #messagesContainer>
      <div *ngFor="let msg of messages" class="message-row" [class.user-row]="msg.role === 'user'">

        <!-- Assistant avatar -->
        <div class="msg-avatar" *ngIf="msg.role === 'assistant'">
          <mat-icon>smart_toy</mat-icon>
        </div>

        <!-- Bubble -->
        <div class="message-bubble" [class.user-bubble]="msg.role === 'user'"
          [class.assistant-bubble]="msg.role === 'assistant'">

          <!-- Typing indicator -->
          <div *ngIf="msg.loading" class="typing-indicator">
            <span></span><span></span><span></span>
          </div>

          <!-- Content -->
          <div *ngIf="!msg.loading" [innerHTML]="formatContent(msg.content)"></div>
        </div>

        <!-- User avatar -->
        <div class="msg-avatar user-avatar" *ngIf="msg.role === 'user'">
          <mat-icon>person</mat-icon>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <textarea
        [(ngModel)]="userInput"
        (keydown)="onKeyDown($event)"
        placeholder="Posez votre question…"
        rows="1"
        [disabled]="isTyping"
        class="chat-input"
        aria-label="Message">
      </textarea>
      <button
        class="send-btn"
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isTyping"
        matTooltip="Envoyer (Entrée)">
        <mat-icon>send</mat-icon>
      </button>
    </div>

    <!-- Footer -->
    <div class="chat-footer">
      <small>Propulsé par <strong>Gemini AI</strong> · LangChain</small>
    </div>
  </div>

  <!-- Toggle Button -->
  <button class="chatbot-toggle" (click)="toggleChat()"
    [class.active]="isOpen"
    [attr.aria-label]="isOpen ? 'Fermer le chat' : 'Ouvrir le conseiller virtuel'"
    matTooltip="{{ isOpen ? '' : 'Conseiller virtuel LTS Academy' }}"
    matTooltipPosition="left">
    <mat-icon class="icon-open">chat</mat-icon>
    <mat-icon class="icon-close">close</mat-icon>
    <span class="notification-dot" *ngIf="!isOpen"></span>
  </button>
</div>
